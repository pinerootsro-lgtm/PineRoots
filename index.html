<style>
/* Layout: one quiet column that walks the guest from the road to the door; a thin path line ties the three arrival steps together. */
:root{
  --paper:#EDEEE8; --panel:#E2E4DC; --ink:#1C1F1B; --muted:#585E55; --line:#C9CCC1;
  --pine:#355640; --bronze:#8A5B3B; --land-o:.3; --lamp:#D9761A; --lamp-glow:rgba(217,118,26,.28); --chip:#F6F6F1;
  --f-display:"Spectral","Iowan Old Style",Georgia,serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121512; --panel:#1B1F1B; --ink:#E5E5DD; --muted:#A0A79B; --line:#30352F;
    --pine:#9CBDA2; --bronze:#C99C78; --land-o:.26; --lamp:#F09A45; --lamp-glow:rgba(240,154,69,.26); --chip:#1E231E; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:3px}

/* line-art landscape behind the page, drawn in the logo's language */
.land{position:fixed;left:0;right:0;bottom:0;height:clamp(260px,42vh,460px);z-index:0;pointer-events:none;color:var(--bronze);opacity:var(--land-o);-webkit-mask-image:linear-gradient(to top,#000 50%,transparent);mask-image:linear-gradient(to top,#000 50%,transparent)}
.land svg{display:block;width:100%;height:100%}
.wrap{position:relative;z-index:1}
.wrap{max-width:46rem;margin-inline:auto;padding-inline:20px;padding-block:44px 96px}
.lbl{display:block;font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{display:grid;gap:18px}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;flex:none;color:var(--bronze)}
.eyebrow .sep{margin-inline:.55em;color:var(--bronze)}
h1{margin:0;font-family:var(--f-display);font-weight:300;font-size:clamp(2.6rem,9vw,4rem);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.lead{margin:0;max-width:33rem;font-size:1.08rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--panel)}
.btn.primary:hover{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.addr{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:15px}
.coords{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* at a glance */
.glance{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cell{background:var(--paper);padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.cell .val{font-family:var(--f-mono);font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell .sub{font-size:13.5px;color:var(--muted)}
.dial{display:flex;gap:5px}
.dial span{display:grid;place-items:center;width:1.7em;height:2.1em;font-family:var(--f-mono);font-size:1.25rem;font-weight:500;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.copy{justify-self:start;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:13px;cursor:pointer}
.copy:hover{border-color:var(--ink)}
@media (max-width:719px){.glance .cell.wide{grid-column:span 2}}
@media (min-width:720px){.glance{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* sections */
section.block{padding-top:64px;display:grid;gap:22px}
.block-head{display:grid;gap:6px}
h2{margin:0;font-family:var(--f-display);font-weight:300;font-size:clamp(1.8rem,5.5vw,2.3rem);line-height:1.1;text-wrap:balance}
h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.2}

.route{margin:0;display:grid}
.route .row{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.route .row:last-of-type{border-bottom:1px solid var(--line)}
.route dt{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.route dd{margin:0;min-width:0}
@media (max-width:540px){.route .row{grid-template-columns:minmax(0,1fr)}}

/* arrival path */
.path{display:grid;list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 18px;padding-bottom:48px}
.step::before{content:"";position:absolute;left:calc(1.2rem - .5px);top:2.6rem;bottom:.2rem;width:1px;background:var(--line)}
.step:last-child{padding-bottom:0}
.step:last-child::before{display:none}
.node{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.9rem;background:var(--paper)}
.step-body{display:grid;gap:12px;min-width:0;padding-top:4px}
.step-body p{margin:0;max-width:34rem}
figure{margin:4px 0 0;max-width:27rem}
figure.photo{position:relative;container-type:inline-size;border-radius:8px;overflow:hidden;background:var(--panel)}
figure.photo img{display:block;width:100%;height:auto}
figure.vid{max-width:17rem;border-radius:12px;overflow:hidden;background:var(--panel)}
figure.vid video{display:block;width:100%;height:auto;aspect-ratio:478/850}
figcaption{font-size:13px;color:var(--muted);padding:8px 2px 0}
.codechip.none{letter-spacing:.02em;font-size:13px;font-size:clamp(11px,3.4cqw,16px)}
.codechip{position:absolute;left:44%;top:51%;transform:translate(-50%,-50%);padding:.25em .55em;border-radius:6px;background:var(--chip);color:var(--ink);border:1px solid var(--line);font-family:var(--f-mono);font-weight:500;font-size:16px;font-size:clamp(13px,4.6cqw,24px);letter-spacing:.18em;box-shadow:0 2px 10px rgba(0,0,0,.18);white-space:nowrap}

.lampnote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:start;padding:16px;border-radius:10px;background:var(--panel);max-width:34rem}
.lamp{width:14px;height:14px;margin-top:5px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 5px var(--lamp-glow);animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:.25}}
.lampnote strong{font-weight:600}
.lampnote .why{display:block;margin-top:6px;font-size:14.5px;color:var(--muted)}
.ifclose{display:grid;gap:8px;max-width:34rem;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.ifclose ul{margin:0;padding-left:1.1rem;display:grid;gap:4px}
.ifclose .t{font-weight:600}
.exit{font-size:14.5px;color:var(--muted)}

/* wifi */
.wifi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wifi .cell .val{font-size:1.15rem}
.wifi-note{margin:0;font-size:14.5px;color:var(--muted)}
@media (max-width:540px){.wifi{grid-template-columns:minmax(0,1fr)}}

/* rules */
.rules{list-style:none;margin:0;padding:0;display:grid}
.rules li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:10px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}
.rules li:last-child{border-bottom:1px solid var(--line)}
.rules .mk{color:var(--pine);font-size:13px;padding-top:3px}

/* places */
.places{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0 32px}
.places li{display:grid;gap:2px;padding:15px 0;border-top:1px solid var(--line);align-content:start}
.places .name{font-weight:600}
.places .where{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.places .desc{color:var(--muted);font-size:15px}
@media (min-width:720px){.places{grid-template-columns:repeat(2,minmax(0,1fr))}}

.outro{padding-top:72px;display:grid;gap:14px}
.outro p{margin:0;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:1.35rem;line-height:1.4;max-width:32rem}
.phone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.phone .num{font-family:var(--f-mono);font-size:1.05rem;margin-right:6px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
footer .motto{font-family:var(--f-display);font-style:italic;font-size:15px;color:var(--ink)}

.state{min-height:50vh;display:grid;place-content:center;gap:12px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* bird-song toggle */
.birds{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:9px;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.birds:hover{border-color:var(--muted)}
.birds .ico{width:22px;height:14px;color:var(--bronze);flex:none}
.birds .sw{position:relative;width:28px;height:16px;border-radius:999px;border:1px solid var(--muted);flex:none;transition:background-color .2s,border-color .2s}
.birds .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .2s,background-color .2s}
.birds[aria-pressed="true"] .sw{background:var(--bronze);border-color:var(--bronze)}
.birds[aria-pressed="true"] .sw::after{transform:translateX(12px);background:var(--paper)}
@media (prefers-reduced-motion: reduce){.lamp{animation:none}.birds .sw,.birds .sw::after{transition:none}}
</style>
</head>
<body>
<div class="land" aria-hidden="true"><svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="butt"><path d="M800,44 L1156,400 M800,44 L444,400" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/><path d="M-40,103 L101,168 L233,115 L332,183 L430,119 L530,168 L654,140 L758,173 L897,147 L1032,179 L1196,98 L1351,175 L1456,101 L1572,194 L1640,185 M233,115 V205 M654,140 V238 M1196,98 V230" stroke-width="1" stroke-opacity="0.45" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/><path d="M-40,251 L159,168 L315,246 L526,186 L704,258 L895,180 L1116,261 L1288,194 L1486,266 L1640,249 M159,168 V332 M526,186 V355 M895,180 V329 M1288,194 V343" stroke-width="1" stroke-opacity="0.6" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/><path d="M-40,348 L270,323 L548,358 L813,320 L1165,360 L1530,309 L1640,361" stroke-width="1" stroke-opacity="0.75" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/><path d="M128,252 V336 M128,252 Q121.3,269.8 107.0,282.2 M128,252 Q134.7,269.8 149.0,282.2 M128,279.7 Q119.2,295.9 103.6,305.8 M128,279.7 Q139.1,292.8 153.2,302.4 M128,304.1 Q116.0,318.7 100.3,329.3 M128,302.4 Q135.6,309.4 144.8,314.2 M1420,214 V326 M1420,214 Q1411.1,237.7 1392.0,254.3 M1420,214 Q1428.9,237.7 1448.0,254.3 M1420,251.0 Q1408.3,272.5 1387.5,285.7 M1420,251.0 Q1434.7,268.4 1453.6,281.2 M1420,283.4 Q1404.0,303.0 1383.0,317.0 M1420,281.2 Q1430.1,290.6 1442.4,296.9 M655,271 V345 M655,271 Q649.1,286.6 636.5,297.6 M655,271 Q660.9,286.6 673.5,297.6 M655,295.4 Q647.2,309.7 633.5,318.4 M655,295.4 Q664.7,306.9 677.2,315.4 M655,316.9 Q644.4,329.8 630.6,339.1 M655,315.4 Q661.7,321.6 669.8,325.8 M790,120 V325 M790,120 Q773.6,163.3 738.8,193.8 M790,120 Q806.4,163.3 841.2,193.8 M790,187.7 Q768.5,227.1 730.5,251.2 M790,187.7 Q817.0,219.5 851.5,243.0 M790,247.1 Q760.7,282.9 722.4,308.6 M790,243.0 Q808.6,260.1 831.0,271.7 M1020,262 V346 M1020,262 Q1013.3,279.8 999.0,292.2 M1020,262 Q1026.7,279.8 1041.0,292.2 M1020,289.7 Q1011.2,305.9 995.6,315.8 M1020,289.7 Q1031.1,302.8 1045.2,312.4 M1020,314.1 Q1008.0,328.7 992.3,339.3 M1020,312.4 Q1027.6,319.4 1036.8,324.2" stroke-width="1" stroke-opacity="0.75" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g></svg></div>
<div class="wrap">
  <main id="app"><div class="state">Se încarcă…</div></main>
  <noscript><p>Pentru această pagină e nevoie de JavaScript activat.</p></noscript>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<button type="button" id="birds" class="birds" aria-pressed="false" aria-label="Pornește ciripitul păsărilor" hidden><svg class="ico" viewBox="0 0 22 14" aria-hidden="true"><path d="M1 7.5c2-2.6 4.2-2.6 5.6 0 1.4-2.6 3.6-2.6 5.6 0M12.5 3.2c1.4-1.8 2.9-1.8 3.9 0 1-1.8 2.5-1.8 3.9 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ciripit</span><span class="sw" aria-hidden="true"></span></button>

<script>
(function(){
  "use strict";
  var COORDS = "46.6595° N · 23.0892° E";
  var FILES = ["date", "sosire", "reguli", "drum", "zona", "restaurante"];
  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  /* ---- parsing the simple text files ---- */
  function lines(txt){
    return String(txt || "").replace(/^﻿/, "").replace(/\r/g, "").split("\n")
      .map(function(l){ return l.trim(); })
      .filter(function(l){ return l && l.charAt(0) !== "#"; });
  }
  function kv(txt){
    var o = {};
    lines(txt).forEach(function(l){
      var i = l.indexOf(":");
      if (i > 0) o[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim();
    });
    return o;
  }
  function rows(txt){
    return lines(txt).map(function(l){ return l.split("|").map(function(s){ return s.trim(); }); });
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u){ return /^https:\/\//i.test(String(u || "")) ? u : "#"; }
  function dial(code){
    return String(code || "").replace(/\s+/g, "").split("").map(function(d){ return "<span>" + esc(d) + "</span>"; }).join("");
  }
  function waNumber(p){
    var d = String(p || "").replace(/\D/g, "");
    if (d.indexOf("00") === 0) d = d.slice(2);
    else if (d.charAt(0) === "0") d = "40" + d.slice(1);
    return d;
  }

  /* The lockbox code is sent in the guest's message, never published here. Clear any code an older link stored. */
  try { localStorage.removeItem("pineroots-cod"); } catch (e) {}

  function render(c){
    var D = c.date, S = c.sosire;
    var code = String(D["cod-cutie"] || "").replace(/\s+/g, "");
    var t = function(k){ return esc(S[k] || ""); };

    var route = c.drum.map(function(r){
      return '<div class="row"><dt>' + esc(r[0]) + "</dt><dd>" + esc(r[1] || "") + "</dd></div>";
    }).join("");
    var rules = c.reguli.map(function(r){
      return '<li><span class="mk" aria-hidden="true">◇</span><span>' + esc(r) + "</span></li>";
    }).join("");
    function places(list){
      return list.map(function(p){
        return '<li><span><span class="name">' + esc(p[0]) + "</span>" + (p[1] ? '<span class="where">' + esc(p[1]) + "</span>" : "") + "</span>" +
          (p[2] ? '<span class="desc">' + esc(p[2]) + "</span>" : "") + "</li>";
      }).join("");
    }
    var phone = "";
    if (D["telefon"]) {
      var wa = waNumber(D["telefon"]);
      phone = '<div class="phone"><span class="lbl" style="width:100%">Telefon gazdă</span><span class="num">' + esc(D["telefon"]) + "</span>" +
        '<a class="btn" href="tel:' + esc(D["telefon"].replace(/[^\d+]/g, "")) + '">Sună</a>' +
        (wa ? '<a class="btn" href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : "") + "</div>";
    }

    app.innerHTML =
      '<header class="hero">' +
        '<div class="brand"><svg class="mark" viewBox="134 54 432 432" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="butt"><path d="M350,64 L556,270 L350,476 L144,270 Z M366,315 L418,273 L494,332 M418,273 V408 M258,383 L347,327 M350,146 V476" stroke-linejoin="miter"/><path d="M304,212 Q335.2,184.7 350,146 Q365.9,184.9 398,212 M350,210 Q331.8,244.3 299,265 M350,209 Q376.6,234.8 407,256 M350,264 Q323.2,299.2 288,326 M350,259 Q367.5,271.7 387,281" stroke-linejoin="round"/></g></svg><p class="eyebrow">PineRoots<span class="sep" aria-hidden="true">·</span>Mărișel, Munții Apuseni</p></div>' +
        "<h1>Până la ușa cabanei</h1>" +
        (S.intro ? '<p class="lead">' + t("intro") + "</p>" : "") +
        '<div class="actions">' +
          '<a class="btn primary" href="' + esc(safeUrl(D["google-maps"])) + '" target="_blank" rel="noopener">Deschide în Google Maps</a>' +
          '<a class="btn" href="' + esc(safeUrl(D["waze"])) + '" target="_blank" rel="noopener">Waze</a>' +
        "</div>" +
        '<p class="addr"><span>' + esc(D["adresa"]) + '</span><span class="coords">' + COORDS + "</span></p>" +
      "</header>" +

      '<section class="glance" aria-label="Pe scurt">' +
        '<div class="cell"><span class="lbl">Check-in, de la</span><span class="val">' + esc(D["check-in"]) + "</span>" + (D["check-in-nota"] ? '<span class="sub">' + esc(D["check-in-nota"]) + "</span>" : "") + "</div>" +
        '<div class="cell"><span class="lbl">Check-out, până la</span><span class="val">' + esc(D["check-out"]) + "</span></div>" +
        '<div class="cell wide"><span class="lbl">Cod cutie cu cifru</span>' + (code ? '<span class="dial" aria-label="Cod ' + esc(code) + '">' + dial(code) + "</span>" : '<span class="sub">Îl găsiți în mesajul nostru.</span>') + "</div>" +
        '<div class="cell wide"><span class="lbl">Parolă Wi-Fi</span><span class="val">' + esc(D["wifi-parola"]) + '</span><button type="button" class="copy" data-copy="' + esc(D["wifi-parola"]) + '">Copiază</button></div>' +
      "</section>" +

      '<section class="block" id="drum">' +
        '<div class="block-head"><span class="lbl">Drumul</span><h2>Până la poartă</h2></div>' +
        '<dl class="route">' + route + "</dl>" +
      "</section>" +

      '<section class="block" id="sosire">' +
        '<div class="block-head"><span class="lbl">Sosirea</span><h2>De la poartă la ușă</h2></div>' +
        '<ol class="path">' +
          '<li class="step"><span class="node" aria-hidden="true">1</span><div class="step-body">' +
            "<h3>" + t("pas1-titlu") + "</h3><p>" + t("pas1-text") + "</p>" +
            '<figure class="photo"><img src="media/poarta-cutie.jpg" width="900" height="840" alt="Gardul de lemn de lângă poartă, cu cutia cu cifru sub plăcuța cu numărul 3" loading="lazy"><span class="codechip' + (code ? "" : " none") + '" aria-hidden="true">' + (code ? esc(code) : "codul din mesaj") + "</span></figure>" +
          "</div></li>" +
          '<li class="step"><span class="node" aria-hidden="true">2</span><div class="step-body">' +
            "<h3>" + t("pas2-titlu") + "</h3><p>" + t("pas2-text") + "</p>" +
            '<div class="lampnote"><span class="lamp" aria-hidden="true"></span><div><strong>' + t("pas2-asteptati") + '</strong><span class="why">' + t("pas2-de-ce") + "</span></div></div>" +
            '<figure class="vid"><video src="media/poarta.mp4" poster="media/poarta-poster.jpg" muted playsinline loop controls preload="metadata"' + (reduceMotion ? "" : " autoplay") + ' aria-label="Poarta deschizându-se spre exterior"></video><figcaption>Poarta se deschide spre exterior. Intrați după ce s-a oprit.</figcaption></figure>' +
            '<div class="ifclose"><span class="t">' + t("pas2-daca-titlu") + "</span><ul><li>" + t("pas2-daca-1") + "</li><li>" + t("pas2-daca-2") + "</li></ul></div>" +
            (S["pas2-plecare"] ? '<p class="exit">' + t("pas2-plecare") + "</p>" : "") +
          "</div></li>" +
          '<li class="step"><span class="node" aria-hidden="true">3</span><div class="step-body">' +
            "<h3>" + t("pas3-titlu") + "</h3><p>" + t("pas3-text") + "</p>" +
            '<figure class="photo"><img src="media/usa-cheie.jpg" width="900" height="960" alt="Intrarea în cabană; o săgeată arată locul cheii, la grinda din dreapta ușii" loading="lazy"></figure>' +
          "</div></li>" +
        "</ol>" +
      "</section>" +

      '<section class="block" id="wifi">' +
        '<div class="block-head"><span class="lbl">Înăuntru</span><h2>Wi-Fi</h2></div>' +
        '<div class="wifi">' +
          '<div class="cell"><span class="lbl">Rețea</span><span class="val">' + esc(D["wifi-retea"]) + "</span></div>" +
          '<div class="cell"><span class="lbl">Parolă</span><span class="val">' + esc(D["wifi-parola"]) + '</span><button type="button" class="copy" data-copy="' + esc(D["wifi-parola"]) + '">Copiază</button></div>' +
        "</div>" + (D["wifi-nota"] ? '<p class="wifi-note">' + esc(D["wifi-nota"]) + "</p>" : "") +
      "</section>" +

      (rules ? '<section class="block" id="reguli"><div class="block-head"><span class="lbl">Regulile casei</span><h2>Puține și simple</h2></div><ul class="rules">' + rules + "</ul></section>" : "") +
      (c.zona.length ? '<section class="block" id="zona"><div class="block-head"><span class="lbl">Prin împrejurimi ☽︎</span><h2>Ce puteți face în zonă</h2></div><ul class="places">' + places(c.zona) + "</ul></section>" : "") +
      (c.restaurante.length ? '<section class="block" id="masa"><div class="block-head"><span class="lbl">Unde mâncați ♨︎</span><h2>Mese în apropiere</h2></div><ul class="places">' + places(c.restaurante) + "</ul></section>" : "") +

      '<section class="outro">' + (S.final ? "<p>" + t("final") + "</p>" : "") + phone + "</section>" +
      '<footer><span class="motto">Nu perfect. Viu.</span><span>PineRoots · ' + esc(D["adresa"]) + "</span></footer>";
  }

  function toast(text){
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function(){ toastEl.hidden = true; }, 3200);
  }

  app.addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]");
    if (!b) return;
    var text = b.getAttribute("data-copy");
    var done = function(){ var o = b.textContent; b.textContent = "Copiat"; setTimeout(function(){ b.textContent = o; }, 1600); };
    var fallback = function(){
      var v = b.parentNode.querySelector(".val");
      if (!v) return;
      var r = document.createRange(); r.selectNodeContents(v);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Textul e selectat. Copiați-l din meniul telefonului.");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (err) { fallback(); }
  });

  Promise.all(FILES.map(function(name){
    return fetch("continut/" + name + ".txt", { cache: "no-cache" }).then(function(r){
      if (!r.ok) throw new Error(name);
      return r.text();
    });
  })).then(function(txt){
    render({
      date: kv(txt[0]), sosire: kv(txt[1]), reguli: lines(txt[2]),
      drum: rows(txt[3]), zona: rows(txt[4]), restaurante: rows(txt[5])
    });
  }).catch(function(){
    app.innerHTML = '<div class="state"><p>Pagina nu s-a putut încărca. Verificați conexiunea și reîncărcați.</p><p><button type="button" class="btn" onclick="location.reload()">Reîncarcă</button></p></div>';
  });

  /* keep the page available offline once it has been opened */
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
<script src="ciripit.js" defer></script>
</body>
</html>
